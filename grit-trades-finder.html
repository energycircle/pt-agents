<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GRIT — Find Your Place in the Trades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --concrete:#E7E7E0; --paper:#F5F4EE; --graphite:#1B1D22; --ink:#111318;
  --orange:#FF5A1F; --hivis:#FFD21E; --steel:#2E5266; --line:#C9C9C0;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ background:var(--concrete); color:var(--ink); font-family:'Barlow',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
.wrap{ max-width:1000px; margin:0 auto; }
.display{ font-family:'Archivo Black',system-ui,sans-serif; letter-spacing:-.01em; line-height:.98; }
.stencil{ font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
.hazard{ background-image:repeating-linear-gradient(45deg,var(--graphite) 0 14px,var(--hivis) 14px 28px); }
.btn{ transition:transform .08s ease; cursor:pointer; font-family:'Barlow',sans-serif; }
.btn:active{ transform:translateY(2px); }
button:focus-visible,[tabindex]:focus-visible{ outline:3px solid var(--steel); outline-offset:2px; }
.rise{ animation:rise .5s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
@media (prefers-reduced-motion:reduce){ .rise{ animation:none; } }
[data-lucide]{ width:1em; height:1em; }
svg.lucide{ width:1em; height:1em; vertical-align:middle; }

/* intro */
.hero-h{ font-size:clamp(38px,8vw,84px); color:var(--ink); max-width:900px; }
.hero-p{ font-size:clamp(17px,2.4vw,22px); line-height:1.5; max-width:620px; margin-top:26px; color:#33363d; }
.cta{ background:var(--orange); color:#fff; border:none; padding:16px 34px; font-size:19px; font-weight:800; border-radius:2px; box-shadow:5px 5px 0 var(--graphite); }

/* quiz */
.scale-btn{ text-align:left; padding:15px 18px; border-radius:2px; font-size:18px; font-weight:700;
  border:2px solid var(--line); background:var(--paper); color:var(--ink); display:flex; align-items:center; gap:14px; width:100%; }
.scale-btn.on{ border-color:var(--orange); background:var(--orange); color:#fff; }
.dot{ width:26px; height:26px; border-radius:50%; flex-shrink:0; border:2px solid var(--line); display:grid; place-items:center; }
.scale-btn.on .dot{ border-color:#fff; }

/* results */
.wire{ display:grid; gap:26px; grid-template-columns:1fr; align-items:center; margin-top:46px; }
@media (min-width:720px){ .wire{ grid-template-columns:minmax(260px,380px) 1fr; } }
.panel{ background:var(--graphite); border-radius:4px; }
.chip{ display:flex; gap:13px; align-items:flex-start; background:var(--paper);
  border:2px solid var(--line); padding:13px 15px; border-radius:2px; }
.sect{ margin-top:52px; margin-bottom:20px; border-top:3px solid var(--graphite); padding-top:18px; }
.grid-cards{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
.role{ background:var(--paper); border:2px solid var(--line); border-radius:3px; padding:17px;
  display:flex; flex-direction:column; gap:10px; }
.role.surprise{ border-color:var(--hivis); }
.role-ic{ width:40px; height:40px; background:var(--graphite); border-radius:3px; display:grid; place-items:center; color:#fff; font-size:21px; flex-shrink:0; }
.blueprint{ background-color:var(--graphite); border-radius:4px; padding:20px 16px 22px;
  background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px);
  background-size:26px 26px; }
.spec-row{ display:grid; grid-template-columns:92px 1fr; gap:14px; align-items:start; }
.spec-cards{ display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
.spec{ border:2px solid #3a3d44; background:#212429; border-radius:3px; padding:10px 12px; }
.spec.strong{ border-color:var(--orange); background:#241a13; }
.final{ margin-top:54px; background:var(--orange); border-radius:4px; padding:clamp(24px,4vw,40px); box-shadow:6px 6px 0 var(--graphite); }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
/* ============================================================
   GRIT — Find Your Place in the Trades  (standalone prototype)
   Interest engine = O*NET Interest Profiler (RIASEC) model.
   Results layer (trade roles) = GRIT-authored. Vanilla JS,
   no build step. Icons via Lucide CDN; fonts via Google Fonts.
   ============================================================ */

var C = { orange:"#FF5A1F", hivis:"#FFD21E", steel:"#2E5266", graphite:"#1B1D22", ink:"#111318", line:"#C9C9C0" };

var DIMS = [
  { k:"R", label:"Hands-On Builder", short:"Builder", color:"#FF5A1F", icon:"wrench",
    blurb:"You'd rather do it than read about it. Real tools, real materials, something finished at the end of the day." },
  { k:"I", label:"Problem-Solver", short:"Solver", color:"#2E5266", icon:"search",
    blurb:"You want to know why it broke and how to outsmart it. The puzzle is the fun part." },
  { k:"A", label:"Designer", short:"Designer", color:"#6E4A8E", icon:"pen-tool",
    blurb:"You care how it looks and how the pieces fit together. You notice when something's a little off." },
  { k:"S", label:"People Person", short:"People", color:"#3E7D5A", icon:"users",
    blurb:"You like helping, teaching, and being the one people count on when something goes wrong." },
  { k:"E", label:"Leader", short:"Leader", color:"#C48A1A", icon:"trending-up",
    blurb:"You like calling the shots, winning the work, and eventually running the whole show." },
  { k:"C", label:"Organizer", short:"Organizer", color:"#465360", icon:"clipboard-list",
    blurb:"You like a plan that holds, numbers that add up, and everything done right the first time." },
];

var ITEMS = [
  {t:"Take a machine apart to figure out how it works",k:"R"},
  {t:"Build something from scratch with power tools",k:"R"},
  {t:"Fix an engine or an appliance that stopped working",k:"R"},
  {t:"Spend the whole day working with your hands, not a screen",k:"R"},
  {t:"Operate heavy equipment on a job",k:"R"},
  {t:"Track down why a system keeps failing",k:"I"},
  {t:"Run tests to diagnose a tricky problem",k:"I"},
  {t:"Figure out the math behind how something is built",k:"I"},
  {t:"Learn how a brand-new technology actually works",k:"I"},
  {t:"Crack a problem everyone else gave up on",k:"I"},
  {t:"Design how a finished space will look and feel",k:"A"},
  {t:"Sketch or model a project before anyone builds it",k:"A"},
  {t:"Come up with a solution nobody else thought of",k:"A"},
  {t:"Customize something until it looks exactly right",k:"A"},
  {t:"Make something that's genuinely nice to look at",k:"A"},
  {t:"Teach someone a skill you're good at",k:"S"},
  {t:"Walk a customer through how to take care of their home",k:"S"},
  {t:"Show a younger worker the ropes",k:"S"},
  {t:"Be the person a family calls when something breaks",k:"S"},
  {t:"Work on a crew where everyone has each other's back",k:"S"},
  {t:"Run your own business one day",k:"E"},
  {t:"Convince a customer your solution is worth it",k:"E"},
  {t:"Lead a crew and make the calls on a job",k:"E"},
  {t:"Bid on a project and win the work",k:"E"},
  {t:"Set big goals and push hard to hit them",k:"E"},
  {t:"Keep a project organized and on schedule",k:"C"},
  {t:"Follow a detailed plan exactly to code",k:"C"},
  {t:"Manage the budget and numbers for a job",k:"C"},
  {t:"Inspect finished work for every small mistake",k:"C"},
  {t:"Keep records so clean nothing ever slips",k:"C"},
];

var SCALE = [
  {v:1,label:"No way"},{v:2,label:"Not really"},{v:3,label:"Maybe"},
  {v:4,label:"Sounds good"},{v:5,label:"Love it"},
];

var TRADES = {
  HVAC:{label:"HVAC",icon:"gauge",color:"#FF5A1F"},
  Electrical:{label:"Electrical",icon:"zap",color:"#C48A1A"},
  Plumbing:{label:"Plumbing",icon:"droplet",color:"#2E5266"},
  Carpentry:{label:"Carpentry",icon:"hammer",color:"#7A5A3A"},
  Cross:{label:"Any Trade",icon:"hard-hat",color:"#3E7D5A"},
};

var BAND_LABEL = ["Hands-on","Diagnostic","Design","People","Business"];

var ROLES = [
  {trade:"HVAC",title:"Install Technician",band:0,icon:"wrench",w:{R:3,C:1,S:1},
   blurb:"You build the system — set the equipment, run the ductwork, make it real. Different house, different puzzle, every week."},
  {trade:"HVAC",title:"Service Technician",band:1,icon:"search",w:{R:2,I:3,S:1},
   blurb:"The detective of the trade. A system's down and it's on you to find out why. Half diagnosis, half hero."},
  {trade:"HVAC",title:"Controls & Automation Tech",band:1,icon:"cpu",surprise:true,w:{I:3,C:2,R:1},
   blurb:"You program the brains of a building — smart thermostats, sensors, whole-building systems. Yes, this is the trades."},
  {trade:"HVAC",title:"System Designer",band:2,icon:"pen-tool",surprise:true,w:{I:3,A:2,C:2},
   blurb:"You size and design the system on a computer before anyone lifts a tool. Engineering, minus the four-year degree."},
  {trade:"HVAC",title:"Comfort Advisor",band:3,icon:"users",w:{E:3,S:3,I:1},
   blurb:"You sit with a family, figure out what they need, and help them choose. People skills pay — often the most on the team."},
  {trade:"HVAC",title:"Owner / Contractor",band:4,icon:"briefcase",w:{E:3,C:2,R:1},
   blurb:"You run the company: the crews, the customers, the money. A lot of shop owners started as a kid holding a flashlight."},

  {trade:"Electrical",title:"Wiring Electrician",band:0,icon:"wrench",w:{R:3,C:1,I:1},
   blurb:"You bring a building to life — rough-in, panels, devices. Precise, physical, and everything runs on what you do."},
  {trade:"Electrical",title:"Service Electrician",band:1,icon:"search",w:{I:3,R:2},
   blurb:"Something's dead and nobody knows why. You read the circuit, find the fault, and fix what others couldn't."},
  {trade:"Electrical",title:"Smart-Systems Tech",band:1,icon:"radio",surprise:true,w:{I:3,C:2,A:1},
   blurb:"Low-voltage, networking, security, smart-home. The fastest-growing corner of the trade, and barely anyone knows it exists."},
  {trade:"Electrical",title:"Solar & Battery Installer",band:0,icon:"zap",w:{R:3,I:2},
   blurb:"You install the systems powering the next few decades. Hands-on now, huge demand ahead."},
  {trade:"Electrical",title:"Estimator",band:4,icon:"clipboard-list",surprise:true,w:{C:3,I:2,E:1},
   blurb:"You price the whole job before it starts — plans, math, materials. You may never touch a tool, and you're essential."},
  {trade:"Electrical",title:"Master Electrician",band:4,icon:"briefcase",w:{E:3,C:2,R:1},
   blurb:"Top of the license ladder. You sign off on work, lead crews, and can run your own shop."},

  {trade:"Plumbing",title:"New-Construction Plumber",band:0,icon:"wrench",w:{R:3,C:1},
   blurb:"You rough in a building from bare studs — the water, the waste, the gas. Fast, physical, satisfying."},
  {trade:"Plumbing",title:"Service Plumber",band:1,icon:"search",w:{R:2,I:2,S:2},
   blurb:"Every call is a new problem in a stranger's home. You diagnose it, fix it, and leave a customer relieved."},
  {trade:"Plumbing",title:"Pipefitter / Steamfitter",band:1,icon:"gauge",w:{R:3,I:2},
   blurb:"Industrial-scale systems — plants, hospitals, high-rises. Precision welding and high pay."},
  {trade:"Plumbing",title:"Water-Quality Specialist",band:1,icon:"shield-check",surprise:true,w:{I:3,C:2},
   blurb:"You test, certify, and protect a building's water. Science-heavy, cert-driven, and quietly in demand."},
  {trade:"Plumbing",title:"Plumbing Designer",band:2,icon:"pen-tool",surprise:true,w:{I:2,A:2,C:3},
   blurb:"You lay out entire plumbing systems in software for big buildings. Design work, in a hard hat when you feel like it."},
  {trade:"Plumbing",title:"Owner / Contractor",band:4,icon:"briefcase",w:{E:3,C:2},
   blurb:"You build the business behind the trucks. Plumbing shops are some of the most profitable in the trades."},

  {trade:"Carpentry",title:"Framer",band:0,icon:"hammer",w:{R:3,E:1},
   blurb:"You put up the skeleton of a building. Fast, strong, outdoors, and you can see a house appear in a week."},
  {trade:"Carpentry",title:"Finish Carpenter",band:2,icon:"pen-tool",w:{R:3,A:3},
   blurb:"The details people run their hands over — trim, stairs, built-ins. Where craft meets patience."},
  {trade:"Carpentry",title:"Cabinet Maker",band:2,icon:"pen-tool",w:{R:2,A:3,I:1},
   blurb:"You design and build furniture and millwork to the millimeter. Half artist, half machinist."},
  {trade:"Carpentry",title:"Custom Remodeler",band:0,icon:"wrench",w:{R:2,A:2,E:2},
   blurb:"You take a tired room and make it something people love. Creative, varied, and you can build it into your own business."},
  {trade:"Carpentry",title:"Project Manager / GC",band:4,icon:"clipboard-list",w:{C:3,E:3,S:2},
   blurb:"You run the whole build — crews, schedule, budget, clients. The person everyone on site answers to."},
  {trade:"Carpentry",title:"Design-Build / CAD",band:2,icon:"cpu",surprise:true,w:{I:2,A:3,C:2},
   blurb:"You design projects on-screen and see them built. The bridge between the drawing and the jobsite."},

  {trade:"Cross",title:"Crew Foreman",band:3,icon:"hard-hat",w:{E:2,S:3,R:2,C:1},
   blurb:"You lead the crew on site — keep people moving, safe, and proud of the work. Leadership you earn with your hands first."},
  {trade:"Cross",title:"Trades Instructor",band:3,icon:"graduation-cap",surprise:true,w:{S:3,R:2,A:1},
   blurb:"You teach the next wave of tradespeople. Yes — you can spend a career in a trade by showing others how it's done."},
  {trade:"Cross",title:"Building Inspector",band:1,icon:"shield-check",surprise:true,w:{C:3,I:2},
   blurb:"You make sure work is safe and to code. Steady, respected, and you're the final word on the job."},
  {trade:"Cross",title:"Sales Engineer",band:4,icon:"trending-up",surprise:true,w:{E:3,I:2,S:2},
   blurb:"You know the tech cold and help contractors buy the right gear. Trade knowledge + people skills = serious income."},
  {trade:"Cross",title:"Trades Content Creator",band:3,icon:"radio",surprise:true,w:{A:3,E:2,S:2,R:1},
   blurb:"You make the videos and shows that teach millions of tradespeople. This is a real career now — and it started in a trade."},
];

var PERSONA = {
  RI:"The Troubleshooter", RA:"The Craftsman", RC:"The Precisionist", RS:"The Go-To Fixer", RE:"The Hands-On Boss",
  IA:"The Systems Designer", IC:"The Diagnostician", IS:"The Explainer", IE:"The Technical Closer",
  AC:"The Detail Designer", AS:"The Creative Collaborator", AE:"The Maker With a Plan",
  SC:"The Coordinator", SE:"The Crew Leader", CE:"The Operator",
};
var SOLO = { R:"The Builder", I:"The Problem-Solver", A:"The Designer", S:"The People Person", E:"The Leader", C:"The Organizer" };

function personaTitle(order){ var a=order[0],b=order[1]; return PERSONA[a+b]||PERSONA[b+a]||SOLO[a]; }

/* ------------------------------ state ------------------------------ */
var state = { screen:"intro", i:0, answers:new Array(ITEMS.length).fill(0) };
var app = document.getElementById("app");
var reduce = window.matchMedia("(prefers-reduced-motion:reduce)").matches;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function ic(name,attrs){ return '<i data-lucide="'+name+'"'+(attrs?" "+attrs:"")+'></i>'; }
function refreshIcons(){ if(window.lucide&&lucide.createIcons) lucide.createIcons(); }

/* ----------------------------- scoring ----------------------------- */
function score(answers){
  var raw={R:0,I:0,A:0,S:0,E:0,C:0};
  ITEMS.forEach(function(it,idx){ raw[it.k]+=answers[idx]||0; });
  var norm={}; Object.keys(raw).forEach(function(k){ norm[k]=(raw[k]-5)/20; });
  var order=DIMS.map(function(d){return d.k;}).sort(function(a,b){return norm[b]-norm[a];});

  var scored=ROLES.map(function(role){
    var num=0,den=0;
    Object.keys(role.w).forEach(function(k){ num+=role.w[k]*norm[k]; den+=role.w[k]; });
    var fit=Math.round((den?num/den:0)*100);
    return Object.assign({},role,{fit:fit});
  }).sort(function(a,b){return b.fit-a.fit;});

  var byTrade={};
  scored.forEach(function(r){ if(r.trade==="Cross")return; (byTrade[r.trade]=byTrade[r.trade]||[]).push(r); });
  var bestTrade=null,best=-1;
  Object.keys(byTrade).forEach(function(t){
    var rs=byTrade[t], n=Math.min(3,rs.length), s=0; for(var j=0;j<n;j++) s+=rs[j].fit; s/=n;
    if(s>best){best=s;bestTrade=t;}
  });

  var top=scored.slice(0,4);
  var topIds={}; top.forEach(function(r){topIds[r.title+r.trade]=1;});
  var surprises=scored.filter(function(r){return r.surprise&&!topIds[r.title+r.trade];}).slice(0,2);
  var tradeRoles=(byTrade[bestTrade]||[]).slice().sort(function(a,b){return a.band-b.band;});
  var radar=DIMS.map(function(d){return {dim:d.short,value:Math.round(norm[d.k]*100)};});

  return { norm:norm, order:order, top:top, surprises:surprises, radar:radar,
    persona:personaTitle(order), trade:bestTrade, tradeRoles:tradeRoles };
}

/* --------------------------- radar (svg) --------------------------- */
function radarSVG(radar){
  var cx=150, cy=132, R=94, n=radar.length, W=300, H=272;
  function pt(i,rad){ var a=(-90+i*(360/n))*Math.PI/180; return [cx+rad*Math.cos(a), cy+rad*Math.sin(a)]; }
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="280" role="img" aria-label="Your interest profile">';
  [0.25,0.5,0.75,1].forEach(function(f){
    var pts=[]; for(var i=0;i<n;i++){ var p=pt(i,R*f); pts.push(p[0].toFixed(1)+","+p[1].toFixed(1)); }
    s+='<polygon points="'+pts.join(" ")+'" fill="none" stroke="#3a3d44" stroke-width="1"/>';
  });
  for(var i=0;i<n;i++){ var p=pt(i,R); s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#3a3d44" stroke-width="1"/>'; }
  var vp=[]; for(var i2=0;i2<n;i2++){ var v=Math.max(0,Math.min(100,radar[i2].value))/100; var q=pt(i2,R*v); vp.push(q[0].toFixed(1)+","+q[1].toFixed(1)); }
  s+='<polygon points="'+vp.join(" ")+'" fill="'+C.orange+'" fill-opacity="0.5" stroke="'+C.orange+'" stroke-width="2"/>';
  for(var i3=0;i3<n;i3++){ var lp=pt(i3,R+16); var anchor=Math.abs(lp[0]-cx)<8?"middle":(lp[0]>cx?"start":"end");
    s+='<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+4).toFixed(1)+'" fill="#cfd0cf" font-size="12" font-weight="700" font-family="Barlow,sans-serif" text-anchor="'+anchor+'">'+radar[i3].dim+'</text>'; }
  s+='</svg>';
  return s;
}

/* ------------------------------ views ------------------------------ */
function render(){
  if(state.screen==="intro") app.innerHTML=viewIntro();
  else if(state.screen==="quiz") app.innerHTML=viewQuiz();
  else if(state.screen==="loading") app.innerHTML=viewLoading();
  else if(state.screen==="results") app.innerHTML=viewResults(score(state.answers));
  bind(); refreshIcons(); window.scrollTo(0,0);
}

function viewIntro(){
  return ''
  +'<div class="hazard" style="height:12px"></div>'
  +'<div class="wrap" style="padding:clamp(28px,6vw,72px) 22px 60px">'
    +'<div class="stencil" style="color:var(--orange);font-size:13px;margin-bottom:28px">GRIT Foundation · Skilled Trades</div>'
    +'<h1 class="display hero-h">The trades need more<br>than one kind of person.</h1>'
    +'<p class="hero-p">Everyone pictures the trades as swinging a hammer all day. That\'s one job out of hundreds. HVAC, electrical, plumbing, and carpentry are full of people who diagnose, design, lead, teach, and run the whole show. Answer a few honest questions and find where <em>you\'d</em> fit.</p>'
    +'<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:36px">'
      +'<button class="btn cta" data-act="start">Find your fit</button>'
      +'<span style="font-size:15px;color:#5b5e64">About 4 minutes · no sign-up · no wrong answers</span>'
    +'</div>'
    +'<div style="margin-top:56px;border-top:2px solid var(--line);padding-top:24px;max-width:720px">'
      +'<div style="display:flex;gap:20px;align-items:baseline;flex-wrap:wrap">'
        +'<span class="display" style="font-size:60px;color:var(--orange)">6%</span>'
        +'<p style="font-size:17px;line-height:1.45;color:#33363d;max-width:470px">of high school students are even looking at the trades. Plenty of the other 94% would be great at this work — they were just never shown the range.</p>'
      +'</div>'
    +'</div>'
  +'</div>';
}

function viewQuiz(){
  var i=state.i, item=ITEMS[i], pct=Math.round(i/ITEMS.length*100);
  var opts=SCALE.map(function(s){
    var on=state.answers[i]===s.v?" on":"";
    return '<button class="btn scale-btn'+on+'" data-act="answer" data-v="'+s.v+'"><span class="dot">'+(on?ic("check",'style="color:#fff"'):"")+'</span>'+esc(s.label)+'</button>';
  }).join("");
  return ''
  +'<div class="wrap" style="padding:18px 22px 0">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
      +'<button class="btn" data-act="back" style="background:none;border:none;display:flex;align-items:center;gap:6px;color:#5b5e64;font-size:15px;font-weight:600">'+ic("arrow-left")+' Back</button>'
      +'<span class="stencil" style="font-size:12px;color:#5b5e64">'+String(i+1).padStart(2,"0")+' / '+ITEMS.length+'</span>'
    +'</div>'
    +'<div style="height:8px;background:#d3d3cb;border-radius:2px;overflow:hidden"><div class="hazard" style="width:'+pct+'%;height:100%;transition:width .25s ease"></div></div>'
  +'</div>'
  +'<div class="wrap" style="padding:0 22px;max-width:760px;min-height:64vh;display:flex;flex-direction:column;justify-content:center">'
    +'<div class="rise">'
      +'<div class="stencil" style="color:var(--orange);font-size:12px;margin-bottom:18px">How much would you enjoy this?</div>'
      +'<h2 class="display" style="font-size:clamp(28px,5.5vw,50px);color:var(--ink);margin:0 0 34px">'+esc(item.t)+'</h2>'
      +'<div style="display:grid;gap:10px">'+opts+'</div>'
    +'</div>'
  +'</div><div style="height:40px"></div>';
}

function viewLoading(){
  return '<div style="min-height:100vh;display:grid;place-items:center;padding:24px"><div style="text-align:center">'
    +'<div class="hazard rise" style="width:220px;height:12px;margin:0 auto 26px"></div>'
    +'<div class="display" style="font-size:clamp(26px,5vw,44px);color:var(--ink)">Reading your blueprint…</div>'
    +'<p style="color:#5b5e64;margin-top:10px;font-size:16px">Matching you to real roles in the trades.</p>'
  +'</div></div>';
}

function roleCard(role,opts){
  opts=opts||{}; var meta=TRADES[role.trade];
  var fit = opts.showFit ? '<span style="font-family:\'Archivo Black\',sans-serif;font-size:20px;color:'+(role.fit>=70?C.orange:"#8a8d92")+'">'+role.fit+'<span style="font-size:12px">% fit</span></span>' : '';
  return '<div class="role'+(opts.surprise?" surprise":"")+'">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start">'
      +'<span class="stencil" style="font-size:11px;color:'+meta.color+';display:flex;align-items:center;gap:6px">'+ic(meta.icon,'style="font-size:14px"')+' '+meta.label+'</span>'+fit
    +'</div>'
    +'<div style="display:flex;gap:11px;align-items:center">'
      +'<div class="role-ic">'+ic(role.icon)+'</div>'
      +'<h3 style="font-size:20px;font-weight:800;line-height:1.05;margin:0">'+esc(role.title)+'</h3>'
    +'</div>'
    +'<p style="font-size:15px;color:#3f4249;line-height:1.45;margin:0">'+esc(role.blurb)+'</p>'
  +'</div>';
}

function spectrum(roles){
  var out="";
  for(var b=0;b<5;b++){
    var group=roles.filter(function(r){return r.band===b;});
    if(!group.length) continue;
    var cards=group.map(function(role){
      var strong=role.fit>=65;
      return '<div class="spec'+(strong?" strong":"")+'">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'
          +'<span style="color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px"><span style="color:'+(strong?C.orange:"#8f9298")+';line-height:1">'+ic(role.icon)+'</span> '+esc(role.title)+'</span>'
          +'<span style="font-family:\'Archivo Black\',sans-serif;font-size:14px;color:'+(strong?C.orange:"#8f9298")+'">'+role.fit+'</span>'
        +'</div>'
        +(strong?'<div style="color:#d9b08c;font-size:12.5px;margin-top:4px;font-weight:600">Strong fit for you</div>':'')
      +'</div>';
    }).join("");
    out+='<div class="spec-row"><div class="stencil" style="color:var(--hivis);font-size:11px;padding-top:6px;text-align:right">'+BAND_LABEL[b]+'</div><div class="spec-cards">'+cards+'</div></div>';
  }
  return out;
}

function sectTitle(n,title,sub){
  return '<div class="sect"><div style="display:flex;gap:14px;align-items:baseline">'
    +'<span class="display" style="font-size:20px;color:var(--orange)">'+n+'</span>'
    +'<h2 class="display" style="font-size:clamp(24px,4vw,38px);color:var(--ink);margin:0">'+esc(title)+'</h2></div>'
    +(sub?'<p style="font-size:16.5px;color:#4a4d53;line-height:1.5;max-width:680px;margin:8px 0 0">'+esc(sub)+'</p>':'')+'</div>';
}

function viewResults(r){
  var t0=DIMS.find(function(d){return d.k===r.order[0];}), t1=DIMS.find(function(d){return d.k===r.order[1];});
  var tradeMeta=TRADES[r.trade];

  var chips=r.order.slice(0,3).map(function(k){
    var d=DIMS.find(function(x){return x.k===k;});
    return '<div class="chip" style="border-left:6px solid '+d.color+'"><span style="color:'+d.color+';font-size:22px;flex-shrink:0;line-height:1;margin-top:2px">'+ic(d.icon)+'</span>'
      +'<div><div style="font-weight:800;font-size:17px">'+d.label+'</div><div style="font-size:14.5px;color:#4a4d53;line-height:1.4">'+esc(d.blurb)+'</div></div></div>';
  }).join("");

  var top=r.top.map(function(role){return roleCard(role,{showFit:true});}).join("");
  var surprises=r.surprises.map(function(role){return roleCard(role,{showFit:true,surprise:true});}).join("");

  var html=''
  +'<div class="hazard" style="height:12px"></div>'
  +'<div class="wrap" style="padding:clamp(26px,5vw,54px) 22px 70px">'
    +'<div class="rise">'
      +'<div class="stencil" style="color:var(--orange);font-size:12px;margin-bottom:14px">Your result</div>'
      +'<h1 class="display" style="font-size:clamp(40px,9vw,92px);color:var(--ink);margin:0">'+esc(r.persona)+'</h1>'
      +'<p style="font-size:clamp(17px,2.3vw,21px);line-height:1.5;max-width:640px;margin-top:16px;color:#33363d">You lean <strong style="color:'+t0.color+'">'+t0.label+'</strong> and <strong style="color:'+t1.color+'">'+t1.label+'</strong>. That combination has a home in every trade below — and probably a few roles you didn\'t know existed.</p>'
    +'</div>'
    +'<section class="wire">'
      +'<div class="panel" style="padding:10px 6px 6px">'
        +'<div class="stencil" style="color:var(--hivis);font-size:11px;padding:8px 14px 0">How you\'re wired</div>'
        +radarSVG(r.radar)
      +'</div>'
      +'<div style="display:grid;gap:10px">'+chips+'</div>'
    +'</section>'
    +sectTitle("01","Roles built for you","Across all four trades, ranked by how well they fit the way you're wired.")
    +'<div class="grid-cards">'+top+'</div>'
    +sectTitle("02","The range inside "+tradeMeta.label,"Your strongest-fit trade isn't one job — it's a whole spectrum. Here's "+tradeMeta.label+" from the tools all the way to the corner office, with your best fits marked.")
    +'<div class="blueprint">'+spectrum(r.tradeRoles)+'</div>';

  if(r.surprises.length){
    html+=sectTitle("03","You probably didn't know these existed","Same trades. Roles nobody tells 16-year-olds about — and they fit you.")
      +'<div class="grid-cards">'+surprises+'</div>';
  }

  html+=''
    +'<div class="final">'
      +'<h3 class="display" style="font-size:clamp(26px,4.5vw,40px);color:#fff;margin:0">Now go touch the tools.</h3>'
      +'<p style="color:#fff;font-size:17.5px;line-height:1.5;max-width:560px;margin-top:10px;opacity:.95">A quiz can point. A GRIT Camp lets you actually try it — real tools, real tradespeople, one day, no cost. That\'s where this gets real.</p>'
      +'<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:22px">'
        +'<a class="btn" href="https://www.thegritfoundation.com/grit-camps" target="_blank" rel="noopener" style="background:#fff;color:var(--ink);border:none;padding:14px 28px;font-size:17px;font-weight:800;border-radius:2px;text-decoration:none;display:inline-block">Find a GRIT Camp</a>'
        +'<button class="btn" data-act="restart" style="background:transparent;color:#fff;border:2px solid #fff;padding:14px 26px;font-size:17px;font-weight:800;border-radius:2px;display:flex;align-items:center;gap:8px">'+ic("rotate-ccw")+' Start over</button>'
      +'</div>'
    +'</div>'
    +'<p style="margin-top:30px;font-size:13.5px;color:#7a7d82;line-height:1.5;max-width:640px">Prototype. The interest engine follows the U.S. Department of Labor\'s O*NET Interest Profiler (RIASEC) model; the trade roles are a GRIT-authored layer. This points toward possibilities to explore — it doesn\'t sort anyone out of anything.</p>'
  +'</div>';
  return html;
}

/* --------------------------- interactions -------------------------- */
function bind(){
  app.querySelectorAll("[data-act]").forEach(function(el){
    el.addEventListener("click",function(){
      var act=el.getAttribute("data-act");
      if(act==="start"){ state.screen="quiz"; state.i=0; render(); }
      else if(act==="back"){ if(state.i>0){state.i--;render();} else {state.screen="intro";render();} }
      else if(act==="answer"){
        state.answers[state.i]=parseInt(el.getAttribute("data-v"),10);
        setTimeout(function(){
          if(state.i<ITEMS.length-1){ state.i++; render(); }
          else { state.screen="loading"; render(); setTimeout(function(){ state.screen="results"; render(); }, reduce?200:1500); }
        }, reduce?0:130);
      }
      else if(act==="restart"){ state.answers=new Array(ITEMS.length).fill(0); state.i=0; state.screen="intro"; render(); }
    });
  });
}

render();
</script>
</body>
</html>
